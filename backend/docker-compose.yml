
services:
  postgres:
    image: postgres:16-alpine
    container_name: appmedicos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: appmedicos
      POSTGRES_PASSWORD: appmedicos_dev
      POSTGRES_DB: appmedicos
    ports:
      - "5433:5432"
    volumes:
      - appmedicos_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  appmedicos_pgdata:
